<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0b0b">
<link rel="manifest" href="manifest.webmanifest">
<title>무음컷</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:#f7f7f7;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}
main{width:min(640px,calc(100% - 28px));margin:28px auto 60px}
h1{font-size:32px;margin:0}.sub{color:#98989d;font-size:14px;line-height:1.55;margin:10px 0 18px}
.pick{display:block;border:1px dashed #687226;background:#11120d;border-radius:22px;padding:32px 18px;text-align:center;font-weight:800}
.pick small{display:block;color:#888;margin-top:8px;font-weight:400}
input[type=file]{display:none}
.card{background:#171719;border:1px solid #303034;border-radius:20px;padding:20px;margin-top:14px}
.filename{word-break:break-all;font-size:15px}
.badge{display:inline-block;margin-top:8px;padding:5px 9px;border-radius:999px;background:#252529;color:#bdbdc2;font-size:11px}
.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}
.preset input{display:none}
.preset span{display:block;border:1px solid #333;border-radius:30px;padding:12px 4px;text-align:center;font-weight:700}
.preset input:checked+span{background:#caff24;color:#111;border-color:#caff24}
.ctrl{margin-top:22px}.row{display:flex;justify-content:space-between;margin-bottom:8px}.row b:last-child{font-size:17px}
input[type=range]{width:100%;accent-color:#caff24}.help,.note{font-size:11px;color:#777;margin-top:6px;line-height:1.5}
button{width:100%;border:0;border-radius:16px;padding:16px;margin-top:22px;background:#caff24;color:#111;font-size:17px;font-weight:900}
button:disabled{opacity:.4}
.status{color:#caff24;font-size:13px;line-height:1.6;margin-top:15px;white-space:pre-wrap;word-break:break-word}
.err{color:#ff7373}
.progress{margin-top:12px;height:8px;background:#2b2b2e;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:#caff24;transition:width .1s}
audio{width:100%;margin-top:15px}
.hidden-media{position:absolute;left:-9999px;width:1px;height:1px;opacity:.01}
</style>
</head>
<body>
<main>
<h1>무음컷</h1>
<p class="sub">MP4/MOV 영상은 아이폰이 직접 재생하면서 음성만 추출합니다. 별도 처리 엔진을 내려받지 않습니다.</p>

<label class="pick" for="file">파일 선택<small>MP3 · WAV · M4A · AAC · MP4 · MOV 지원</small></label>
<input id="file" type="file" accept=".mp3,.wav,.m4a,.aac,.mp4,.mov,audio/*,video/mp4,video/quicktime">

<div class="card" id="fileCard" hidden>
  <div class="filename" id="fileName"></div>
  <div class="badge" id="fileType"></div>
</div>

<div class="card">
<div>세기</div>
<div class="presets">
<label class="preset"><input type="radio" name="p" value="soft"><span>부드럽게</span></label>
<label class="preset"><input type="radio" name="p" value="normal" checked><span>보통</span></label>
<label class="preset"><input type="radio" name="p" value="tight"><span>타이트</span></label>
</div>

<div class="ctrl">
<div class="row"><b>무음 기준</b><b id="tv">-50 dB</b></div>
<input id="t" type="range" min="-70" max="-25" value="-50">
<div class="help">이보다 작은 소리를 공백으로 봅니다</div>
</div>

<div class="ctrl">
<div class="row"><b>최소 길이</b><b id="mv">0.10초</b></div>
<input id="m" type="range" min=".05" max="1" step=".01" value=".10">
<div class="help">이보다 짧은 쉼은 그대로 둡니다</div>
</div>

<div class="ctrl">
<div class="row"><b>남길 공백</b><b id="kv">0.10초</b></div>
<input id="k" type="range" min="0" max=".5" step=".01" value=".10">
<div class="help">문장 사이에 남길 숨 길이입니다</div>
</div>

<button id="run" disabled>무음 줄이기</button>
<div class="progress" id="pg" hidden><div class="bar" id="bar"></div></div>

<div id="result" hidden>
<audio id="audio" controls></audio>
<button id="save">WAV 저장/공유</button>
</div>

<div id="st" class="status"></div>
<div class="note">영상 파일은 영상 길이만큼 음성 추출 시간이 걸릴 수 있습니다. 원본은 변경하지 않으며 결과는 WAV로 저장됩니다.</div>
</div>

<video id="mediaVideo" class="hidden-media" playsinline></video>
<audio id="mediaAudio" class="hidden-media"></audio>
</main>

<script>
const q=s=>document.querySelector(s);
const fileInput=q('#file'), run=q('#run'), t=q('#t'), m=q('#m'), k=q('#k');
const st=q('#st'), pg=q('#pg'), bar=q('#bar'), result=q('#result'), preview=q('#audio'), save=q('#save');
const mediaVideo=q('#mediaVideo'), mediaAudio=q('#mediaAudio');
let currentFile=null, currentIsVideo=false, outBlob=null, outName='', objectURL=null, busy=false;

const PRESETS={soft:[-55,.18,.16],normal:[-50,.10,.10],tight:[-45,.06,.05]};
function refresh(){
  q('#tv').textContent=t.value+' dB';
  q('#mv').textContent=(+m.value).toFixed(2)+'초';
  q('#kv').textContent=(+k.value).toFixed(2)+'초';
}
[t,m,k].forEach(x=>x.oninput=refresh);
document.querySelectorAll('input[name=p]').forEach(x=>x.onchange=()=>{
  const a=PRESETS[x.value]; t.value=a[0];m.value=a[1];k.value=a[2];refresh();
});

function ext(name){return (name.toLowerCase().match(/\.([a-z0-9]+)$/)||[])[1]||''}
function isVideoExt(e){return e==='mp4'||e==='mov'}

fileInput.onchange=()=>{
  const f=fileInput.files[0]; if(!f)return;
  currentFile=f;
  const e=ext(f.name);
  currentIsVideo=isVideoExt(e);
  q('#fileName').textContent=f.name;
  q('#fileType').textContent=currentIsVideo?'영상 → 음성 추출 → WAV':'오디오 → 무음컷 → WAV';
  q('#fileCard').hidden=false;
  result.hidden=true;pg.hidden=true;bar.style.width='0%';st.className='status';
  if(!['mp3','wav','m4a','aac','mp4','mov'].includes(e)){
    run.disabled=true;st.className='status err';st.textContent='지원하지 않는 파일입니다.';
  }else{
    run.disabled=false;st.textContent='';
  }
};

function concatChunks(chunks,total){
  const out=new Float32Array(total);let off=0;
  for(const c of chunks){out.set(c,off);off+=c.length}
  return out;
}

function trimSilence(samples,sr,thresholdDb,minSec,keepSec){
  const threshold=Math.pow(10,thresholdDb/20);
  const frame=Math.max(64,Math.round(sr*0.01));
  const frameCount=Math.ceil(samples.length/frame);
  const silent=new Uint8Array(frameCount);

  for(let f=0;f<frameCount;f++){
    const s=f*frame,e=Math.min(samples.length,s+frame);
    let sum=0,n=0;
    for(let i=s;i<e;i+=2){const v=samples[i];sum+=v*v;n++}
    silent[f]=Math.sqrt(sum/Math.max(1,n))<threshold?1:0;
  }

  const minFrames=Math.max(1,Math.ceil(minSec*sr/frame));
  const keepFrames=Math.max(0,Math.round(keepSec*sr/frame));
  const removeFrame=new Uint8Array(frameCount);
  let a=0;
  while(a<frameCount){
    if(!silent[a]){a++;continue}
    let b=a+1;while(b<frameCount&&silent[b])b++;
    const len=b-a;
    if(len>=minFrames){
      const trim=Math.max(0,len-keepFrames);
      const left=Math.floor(trim/2),right=trim-left;
      for(let i=a;i<a+left;i++)removeFrame[i]=1;
      for(let i=b-right;i<b;i++)removeFrame[i]=1;
    }
    a=b;
  }

  let kept=0;
  for(let f=0;f<frameCount;f++){
    if(!removeFrame[f]) kept+=Math.min(frame,samples.length-f*frame);
  }
  const out=new Float32Array(kept);let o=0;
  for(let f=0;f<frameCount;f++){
    if(removeFrame[f])continue;
    const s=f*frame,e=Math.min(samples.length,s+frame);
    out.set(samples.subarray(s,e),o);o+=e-s;
  }
  return out;
}

function makeWav(samples,sr){
  const bytes=44+samples.length*2;
  const buf=new ArrayBuffer(bytes),v=new DataView(buf);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,'RIFF');v.setUint32(4,bytes-8,true);w(8,'WAVE');w(12,'fmt ');
  v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);
  w(36,'data');v.setUint32(40,samples.length*2,true);
  let o=44;
  for(let i=0;i<samples.length;i++){
    let s=Math.max(-1,Math.min(1,samples[i]));
    v.setInt16(o,s<0?s*32768:s*32767,true);o+=2;
  }
  return new Blob([buf],{type:'audio/wav'});
}

function waitMetadata(media){
  return new Promise((resolve,reject)=>{
    const ok=()=>{cleanup();resolve()};
    const bad=()=>{cleanup();reject(new Error('파일의 음성 트랙을 열지 못했습니다.'))};
    const cleanup=()=>{media.removeEventListener('loadedmetadata',ok);media.removeEventListener('error',bad)};
    if(media.readyState>=1)return resolve();
    media.addEventListener('loadedmetadata',ok,{once:true});
    media.addEventListener('error',bad,{once:true});
  });
}

async function capturePCM(file,isVideo){
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)throw new Error('이 Safari에서는 오디오 처리를 지원하지 않습니다.');

  const media=isVideo?mediaVideo:mediaAudio;
  if(objectURL)URL.revokeObjectURL(objectURL);
  objectURL=URL.createObjectURL(file);
  media.src=objectURL;
  media.preload='auto';
  media.volume=1;
  media.muted=false;
  media.playbackRate=1;

  await waitMetadata(media);
  const duration=media.duration;
  if(!isFinite(duration)||duration<=0)throw new Error('파일 길이를 읽지 못했습니다.');

  const ctx=new AC();
  await ctx.resume();

  const source=ctx.createMediaElementSource(media);
  const processor=ctx.createScriptProcessor(4096,2,1);
  const mute=ctx.createGain();mute.gain.value=0;
  const chunks=[];let total=0;

  processor.onaudioprocess=e=>{
    const input=e.inputBuffer;
    const n=input.length;
    const mono=new Float32Array(n);
    const channels=input.numberOfChannels;
    for(let c=0;c<channels;c++){
      const data=input.getChannelData(c);
      for(let i=0;i<n;i++)mono[i]+=data[i]/channels;
    }
    chunks.push(mono);total+=n;
  };

  source.connect(processor);
  processor.connect(mute);
  mute.connect(ctx.destination);

  let timer=setInterval(()=>{
    if(duration>0){
      const p=Math.min(0.95,media.currentTime/duration);
      bar.style.width=(p*100).toFixed(0)+'%';
      st.textContent=`음성을 추출하는 중입니다... ${media.currentTime.toFixed(1)} / ${duration.toFixed(1)}초`;
    }
  },200);

  await new Promise((resolve,reject)=>{
    const ended=()=>resolve();
    const errored=()=>reject(new Error('재생 중 오류가 발생했습니다.'));
    media.addEventListener('ended',ended,{once:true});
    media.addEventListener('error',errored,{once:true});
    media.currentTime=0;
    const p=media.play();
    if(p&&p.catch)p.catch(reject);
  });

  clearInterval(timer);
  processor.disconnect();source.disconnect();mute.disconnect();
  media.pause();media.removeAttribute('src');media.load();
  await ctx.close();

  return {samples:concatChunks(chunks,total),sampleRate:ctx.sampleRate,duration};
}

run.onclick=async()=>{
  if(!currentFile||busy)return;
  busy=true;run.disabled=true;result.hidden=true;pg.hidden=false;bar.style.width='0%';st.className='status';

  try{
    st.textContent=currentIsVideo?'영상에서 음성을 추출하는 중입니다...':'오디오를 읽는 중입니다...';
    const cap=await capturePCM(currentFile,currentIsVideo);
    bar.style.width='96%';
    st.textContent='무음 구간을 줄이는 중입니다...';

    await new Promise(r=>setTimeout(r,30));
    const trimmed=trimSilence(cap.samples,cap.sampleRate,+t.value,+m.value,+k.value);
    if(!trimmed.length)throw new Error('설정값이 너무 강해서 남길 음성이 없습니다.');

    st.textContent='WAV 파일을 만드는 중입니다...';
    outBlob=makeWav(trimmed,cap.sampleRate);
    outName=(currentFile.name.replace(/\.[^.]+$/,'')||'audio')+'_무음컷.wav';

    preview.src=URL.createObjectURL(outBlob);
    result.hidden=false;bar.style.width='100%';

    const before=cap.samples.length/cap.sampleRate;
    const after=trimmed.length/cap.sampleRate;
    st.textContent=`완료! ${before.toFixed(1)}초 → ${after.toFixed(1)}초 (${Math.max(0,before-after).toFixed(1)}초 줄어듦)\n결과: ${outName}`;
  }catch(e){
    st.className='status err';
    st.textContent='오류: '+(e?.message||String(e));
  }finally{
    busy=false;run.disabled=false;
  }
};

save.onclick=async()=>{
  if(!outBlob)return;
  const outFile=new File([outBlob],outName,{type:'audio/wav'});
  if(navigator.share&&navigator.canShare&&navigator.canShare({files:[outFile]})){
    try{await navigator.share({files:[outFile],title:'무음컷 WAV'});return}
    catch(e){if(e.name==='AbortError')return}
  }
  const a=document.createElement('a');
  a.href=URL.createObjectURL(outBlob);a.download=outName;a.click();
};

refresh();
</script>
</body>
</html>
